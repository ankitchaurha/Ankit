<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice add-to-stock test</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f4f4f2;--bd:#d8d8d4;--ac:#0f6e56;--on:#fff;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--card:#222;--bd:#3a3a3a;--ac:#4fc3a1;--on:#000;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:auto;padding:14px;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:760px}
h1{font-size:18px;margin:0 0 10px}h2{font-size:12px;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.m{padding:8px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-size:13px}
.m.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent)}
input{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin-top:8px}
button{padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:600 16px system-ui;width:100%;cursor:pointer;margin:10px 0}
button.rec{background:var(--bad);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.wrap{overflow-x:auto}small{color:var(--mut)}
</style></head><body>
<h1>Voice add-to-stock test</h1>
<div class="card"><div class="methods" id="meth"></div>
<input id="key" type="password" style="display:none" oninput="keys[METHODS[cur].id]=this.value">
<input id="typed" style="display:none" placeholder='Type e.g. "dolo 650 do patti"'></div>
<button id="go" onclick="toggle()">🎤 Start</button>
<div class="card">Heard: <b id="heard">—</b><div id="res" style="margin-top:6px"></div></div>
<small>Say the same sentence on every method, e.g. "Dolo 650 two strips", "Benadryl syrup five", "Ceftriaxone injection ten".</small>
<h2>Results by method</h2>
<div class="wrap"><table><thead><tr><th>Method</th><th>Heard</th><th>Matched</th><th>Qty</th><th>ms</th></tr></thead><tbody id="log"></tbody></table></div>
<h2>Stock added</h2>
<div class="wrap"><table><tbody id="stock"></tbody></table></div>
<script>
const RAW=["Paracetamol 500|Tab","Paracetamol 650|Tab","Dolo 650|Tab","Crocin 500|Tab","Azithromycin 500|Tab","Amoxicillin 500|Cap","Augmentin 625|Tab","Cetirizine 10|Tab","Levocetirizine 5|Tab","Pantoprazole 40|Tab","Rabeprazole 20|Tab","Omeprazole 20|Cap","Metformin 500|Tab","Glimepiride 2|Tab","Amlodipine 5|Tab","Telmisartan 40|Tab","Atorvastatin 10|Tab","Rosuvastatin 10|Tab","Ibuprofen 400|Tab","Diclofenac 50|Tab","Aceclofenac 100|Tab","Ondansetron 4|Tab","Domperidone 10|Tab","Montelukast 10|Tab","Levofloxacin 500|Tab","Ciprofloxacin 500|Tab","Metronidazole 400|Tab","Doxycycline 100|Cap","Folic Acid 5|Tab","Thyronorm 50|Tab","Eltroxin 50|Tab","Shelcal 500|Tab","Limcee 500|Tab","Zincovit|Tab","Ecosprin 75|Tab","Sinarest|Tab","Combiflam|Tab","Allegra 120|Tab","Becosules|Cap","Pan D|Cap","Benadryl|Syp","Corex DX|Syp","Ascoril LS|Syp","Digene|Syp","Cremaffin|Syp","Calpol 250|Syp","Zincovit|Syp","Ambrodil S|Syp","Azithromycin 200|Syp","Amoxicillin 125|Syp","Ceftriaxone 1g|Inj","Pantoprazole 40|Inj","Diclofenac 75|Inj","Ondansetron 4|Inj","Dexamethasone 4|Inj","Tetanus Toxoid|Inj","Mixtard 30|Inj","Vitamin B12 1500|Inj","Gentamicin 80|Inj","Avil 2ml|Inj","Rantac 50|Inj","Normal Saline|Inj","Betadine|Oint","Soframycin|Oint","Volini|Oint","Ciplox|Drop","Otrivin|Drop","Moxifloxacin|Drop"];
const STOCK=RAW.map(s=>{const[n,f]=s.split('|');return{name:n,form:f,qty:0}});
const FORMS={tab:'Tab',tablet:'Tab',tablets:'Tab',goli:'Tab',syp:'Syp',syrup:'Syp',inj:'Inj',injection:'Inj',cap:'Cap',capsule:'Cap',drop:'Drop',drops:'Drop',cream:'Oint',ointment:'Oint',gel:'Oint'};
const NUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twenty:20,fifty:50,hundred:100,ek:1,do:2,teen:3,char:4,chaar:4,panch:5,paanch:5,chhe:6,che:6,saat:7,sat:7,aath:8,nau:9,das:10,bees:20,pachas:50,sau:100};
const V={'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऑ':'o','ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','े':'e','ै':'ai','ो':'o','ौ':'au','ॉ':'o','ं':'n','ँ':'n','ः':'h'};
const C={'क':'k','ख':'kh','ग':'g','घ':'gh','च':'ch','छ':'chh','ज':'j','झ':'jh','ट':'t','ठ':'t','ड':'d','ढ':'d','त':'t','थ':'t','द':'d','ध':'d','न':'n','प':'p','फ':'f','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ण':'n'};
function tr(s){let o='';const a=[...s];for(let i=0;i<a.length;i++){const c=a[i],n=a[i+1];if(C[c]){o+=C[c];if(n==='्')i++;else if(n&&n!==' '&&!V[n]&&n!=='़')o+='a'}else if(V[c])o+=V[c];else if(c!=='्'&&c!=='़')o+=c}return o}
const norm=s=>tr(String(s).toLowerCase()).replace(/aa/g,'a').replace(/ee/g,'i').replace(/[^a-z0-9]+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length);
function parse(text){const all=norm(text).split(' ').filter(Boolean),w=all.filter(x=>!FORMS[x]);if(!w.length)return null;
 const form=all.map(x=>FORMS[x]).find(Boolean);
 const sc=STOCK.map((it,i)=>{let s=0,L=0;norm(it.name).split(' ').forEach(x=>{const num=/^\d/.test(x),wt=num?2:x.length;L+=wt;s+=wt*(num?(w.includes(x)?1:0):Math.max(...w.map(y=>sim(x,y))))});return{i,s:s/L+(form&&form===it.form?.08:0)}}).sort((a,b)=>b.s-a.s);
 const b=sc[0],it=STOCK[b.i],sn=norm(it.name).split(' ').filter(x=>/^\d/.test(x));let q=1;
 w.forEach(x=>{if(sn.includes(x))return;if(/^\d{1,4}$/.test(x))q=+x;else if(NUM[x])q=NUM[x]});
 return{i:b.i,name:`${it.name} (${it.form})`,qty:q,score:Math.min(b.s,1),ids:sc.slice(0,3).map(c=>c.i),alt:sc.slice(1,3).map(c=>STOCK[c.i].name+' '+STOCK[c.i].form).join(', ')}}
const METHODS=[{id:'ws-en',name:'Browser · English (India)',kind:'ws',lang:'en-IN'},{id:'ws-hi',name:'Browser · Hindi',kind:'ws',lang:'hi-IN'},{id:'ws-us',name:'Browser · English (US)',kind:'ws',lang:'en-US'},{id:'sarvam',name:'Sarvam Saaras v3',kind:'rec'},{id:'openai',name:'OpenAI transcribe',kind:'rec'},{id:'deepgram',name:'Deepgram Nova-3',kind:'rec'},{id:'text',name:'Typed text (matcher only)',kind:'text'}];
const API={
async sarvam(b,k){const f=new FormData();f.append('file',b,'a.webm');f.append('model','saaras:v3');f.append('mode','codemix');const r=await fetch('https://api.sarvam.ai/speech-to-text',{method:'POST',headers:{'api-subscription-key':k},body:f});const j=await r.json();if(!r.ok)throw new Error(JSON.stringify(j));return j.transcript},
async openai(b,k){const f=new FormData();f.append('file',b,'a.webm');f.append('model','gpt-4o-mini-transcribe');f.append('prompt','Indian pharmacy items: tablets, syrup, injection, strips');const r=await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+k},body:f});const j=await r.json();if(!r.ok)throw new Error(JSON.stringify(j));return j.text},
async deepgram(b,k){const r=await fetch('https://api.deepgram.com/v1/listen?model=nova-3&language=multi&smart_format=true',{method:'POST',headers:{Authorization:'Token '+k,'Content-Type':b.type||'audio/webm'},body:b});const j=await r.json();if(!r.ok)throw new Error(JSON.stringify(j));return j.results.channels[0].alternatives[0].transcript}};
const $=id=>document.getElementById(id);let cur=0,keys={},LOG=[],stopper=null,busy=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setBtn=on=>{$('go').className=on?'rec':'';$('go').textContent=on?'⏹ Stop':(METHODS[cur].kind==='text'?'Match text':'🎤 Start')};
function pick(i){if(busy)return;cur=i;const m=METHODS[i];$('key').style.display=m.kind==='rec'?'':'none';$('key').value=keys[m.id]||'';$('key').placeholder=m.name+' API key (stays in this page)';$('typed').style.display=m.kind==='text'?'':'none';setBtn(false);
$('meth').innerHTML=METHODS.map((x,j)=>`<div class="m ${j===i?'on':''}" onclick="pick(${j})">${x.name}</div>`).join('')}
function runWS(m){return new Promise((res,rej)=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return rej(new Error('Not supported here. Use Chrome.'));const r=new SR();r.lang=m.lang;r.interimResults=true;let t0=0,done=false;stopper=()=>r.stop();
r.onspeechend=()=>{t0=performance.now()};r.onresult=e=>{const x=e.results[e.results.length-1];$('heard').textContent=x[0].transcript;if(x.isFinal){done=true;res({text:x[0].transcript,ms:t0?Math.round(performance.now()-t0):0})}};
r.onerror=e=>rej(new Error(e.error));r.onend=()=>{if(!done)rej(new Error('No speech heard'))};r.start()})}
async function runRec(m){const k=(keys[m.id]||'').trim();if(!k)throw new Error('Enter the API key first');
const s=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(s),ch=[];mr.ondataavailable=e=>ch.push(e.data);
const stopped=new Promise(r=>mr.onstop=r);stopper=()=>mr.stop();mr.start();$('heard').textContent='Listening…';await stopped;
s.getTracks().forEach(t=>t.stop());stopper=null;const t0=performance.now();$('heard').textContent='Transcribing…';
const text=await API[m.id](new Blob(ch,{type:mr.mimeType}),k);return{text,ms:Math.round(performance.now()-t0)}}
async function toggle(){if(stopper){stopper();return}if(busy)return;busy=true;const m=METHODS[cur];setBtn(true);
try{let out;if(m.kind==='text')out={text:$('typed').value,ms:0};else if(m.kind==='ws')out=await runWS(m);else out=await runRec(m);
$('heard').textContent=out.text||'(empty)';const p=parse(out.text),ok=!!p&&p.score>=.6;if(ok)STOCK[p.i].qty+=p.qty;LOG.unshift({m:m.name,text:out.text,ms:out.ms,p,ok});render()}
catch(e){$('heard').textContent='⚠ '+e.message}
stopper=null;busy=false;setBtn(false)}
function render(){const L=LOG[0];
$('res').innerHTML=L&&L.p?`<b>${esc(L.p.name)}</b> × ${L.p.qty} ${L.ok?'✅ added':'⚠ low confidence, not added'}<br><small>match ${Math.round(L.p.score*100)}% · next: ${esc(L.p.alt)}</small>`:'';
$('log').innerHTML=LOG.map(l=>`<tr><td>${esc(l.m)}</td><td>${esc(l.text)}</td><td>${l.p?esc(l.p.name)+(l.ok?'':' ⚠'):'—'}</td><td>${l.p?l.p.qty:''}</td><td>${l.ms}</td></tr>`).join('');
$('stock').innerHTML=STOCK.filter(x=>x.qty).map(x=>`<tr><td>${esc(x.name)} <small>${x.form}</small></td><td>${x.qty}</td></tr>`).join('')||'<tr><td><small>Nothing added yet</small></td></tr>'}
pick(0);render();
</script>
<script>
METHODS.splice(3,3);METHODS.unshift({id:'auto',name:'Auto · Hindi ⇄ English',kind:'auto'});
const SWITCH=.75;
function best(alts){let b=null;alts.forEach(t=>{const p=parse(t);if(p&&(!b||p.score>b.p.score))b={p,t}});return b}
function listen(lang){return new Promise((res,rej)=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return rej(new Error('Use Chrome'));const r=new SR();r.lang=lang;r.interimResults=true;r.maxAlternatives=5;let t0=0,done=false;stopper=()=>r.stop();
r.onspeechend=()=>{t0=performance.now()};
r.onresult=e=>{const x=e.results[e.results.length-1];$('heard').textContent=x[0].transcript;if(x.isFinal){done=true;res({alts:Array.from(x).map(a=>a.transcript),ms:t0?Math.round(performance.now()-t0):0})}};
r.onerror=e=>rej(new Error(e.error));r.onend=()=>{if(!done)rej(new Error('No speech heard'))};r.start()})}
async function toggle(){if(stopper){stopper();return}if(busy)return;busy=true;const m=METHODS[cur];setBtn(true);
try{let o;
if(m.kind==='text'){const t=$('typed').value;o={b:best([t]),ms:0,t,m:m.name}}
else if(m.kind==='ws'){const r=await listen(m.lang);o={b:best(r.alts),ms:r.ms,t:r.alts[0],m:m.name}}
else{const r1=await listen('hi-IN');let b=best(r1.alts),t=r1.alts[0],ms=r1.ms,n='Auto (hi';
if(!b||b.p.score<SWITCH){$('heard').textContent='Low match. Switching to English, say it again…';stopper=null;await new Promise(z=>setTimeout(z,300));
try{const r2=await listen('en-IN'),b2=best(r2.alts);n+=' → en';if(b2&&(!b||b2.p.score>b.p.score)){b=b2;t=r2.alts[0];ms=r2.ms;n+=' ✓'}}catch(_){n+=' → en failed'}}
o={b,ms,t,m:n+')'}}
finish(o)}catch(e){$('heard').textContent='⚠ '+e.message}
stopper=null;busy=false;setBtn(false)}
function finish(o){const p=o.b?o.b.p:null,ok=!!p&&p.score>=.6;if(ok)STOCK[p.i].qty+=p.qty;$('heard').textContent=o.t||'(empty)';LOG.unshift({m:o.m,text:o.t,ms:o.ms,p,ok});render()}
function addItem(i,q){STOCK[i].qty+=q;const L=LOG[0];L.ok=true;L.p={...L.p,i,name:STOCK[i].name+' ('+STOCK[i].form+')'};render()}
function render(){const L=LOG[0];
$('res').innerHTML=L&&L.p?`<b>${esc(L.p.name)}</b> × ${L.p.qty} ${L.ok?'✅ added':'⚠ not sure, tap the right one:'}<br><small>match ${Math.round(L.p.score*100)}%</small>`+(L.ok?'':'<div>'+L.p.ids.map(i=>`<button style="width:auto;padding:8px 12px;margin:4px 4px 0 0;font-size:14px" onclick="addItem(${i},${L.p.qty})">${esc(STOCK[i].name+' '+STOCK[i].form)}</button>`).join('')+'</div>'):'';
$('log').innerHTML=LOG.map(l=>`<tr><td>${esc(l.m)}</td><td>${esc(l.text||'')}</td><td>${l.p?esc(l.p.name)+(l.ok?'':' ⚠'):'—'}</td><td>${l.p?l.p.qty:''}</td><td>${l.ms}</td></tr>`).join('');
$('stock').innerHTML=STOCK.filter(x=>x.qty).map(x=>`<tr><td>${esc(x.name)} <small>${x.form}</small></td><td>${x.qty}</td></tr>`).join('')||'<tr><td><small>Nothing added yet</small></td></tr>'}
METHODS[0]={id:'smart',name:'Smart · speak once',kind:'ws',lang:'hi-IN'};
Object.assign(NUM,{tin:3,ath:8,bis:20,pacas:50,cha:6,chhah:6,nao:9});
const sk=s=>s.replace(/ph/g,'f').replace(/sh/g,'s').replace(/([tdkgbjcp])h/g,'$1').replace(/c(?=[eiy])/g,'s').replace(/[ckq]/g,'k').replace(/[wv]/g,'v').replace(/z/g,'j').replace(/x/g,'ks').replace(/^[aeiouy]+/,'A').replace(/[aeiouy]+/g,'').replace(/A/,'a').replace(/(.)\1+/g,'$1');
function parse(text){text=String(text).replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d));
const all=norm(text).split(' ').filter(Boolean),w0=all.filter(x=>!FORMS[x]);if(!w0.length)return null;
const form=all.map(x=>FORMS[x]).find(Boolean),w=[...w0];
for(let i=0;i<w0.length-1;i++)if(!/\d/.test(w0[i]+w0[i+1]))w.push(w0[i]+w0[i+1]);
const ws=w.map(y=>[y,sk(y)]);
const sc=STOCK.map((it,i)=>{let s=0,L=0;norm(it.name).split(' ').forEach(x=>{const num=/^\d/.test(x),wt=num?2:x.length;L+=wt;const xs=sk(x);
s+=wt*(num?(w0.includes(x)?1:0):Math.max(...ws.map(([y,ys])=>Math.max(sim(x,y),xs.length>1&&ys.length>1?.95*sim(xs,ys):0))))});
return{i,s:s/L+(form&&form===it.form?.08:0)}}).sort((a,b)=>b.s-a.s);
const b=sc[0],it=STOCK[b.i],sn=norm(it.name).split(' ').filter(x=>/^\d/.test(x));let q=1;
w0.forEach(x=>{if(sn.includes(x))return;if(/^\d{1,4}$/.test(x))q=+x;else if(NUM[x])q=NUM[x]});
return{i:b.i,name:`${it.name} (${it.form})`,qty:q,score:Math.min(b.s,1),ids:sc.slice(0,3).map(c=>c.i),alt:sc.slice(1,3).map(c=>STOCK[c.i].name+' '+STOCK[c.i].form).join(', ')}}
pick(0);render();
</script>
<script>
let uid=0;
METHODS.unshift({id:'multi',name:'Multi · say many items',kind:'multi',lang:'hi-IN'});
const UNITS=new Set(['patti','patta','strip','strips','bottle','botal','sisi','piece','pieces','box','dabba','vial','pack','packet','nos']),SEP=new Set(['aur','and','phir','fir','then','next']);
const F3=['Dolo 650','Paracetamol 500','Crocin 500'],CG=['Corex DX','Benadryl','Ascoril LS'],PN=['Combiflam','Diclofenac 50','Ibuprofen 400'],CD=['Sinarest','Cetirizine 10'],AC=['Digene','Pantoprazole 40'],VM=['Ondansetron 4','Domperidone 10'];
const AL={bukhar:F3,fever:F3,sardi:CD,jukam:CD,khansi:CG,cough:CG,dard:PN,pain:PN,acidity:AC,gas:AC,gais:AC,ulti:VM,vomiting:VM,sugar:['Metformin 500','Glimepiride 2'],thyroid:['Thyronorm 50','Eltroxin 50'],calcium:['Shelcal 500'],allergy:['Allegra 120','Cetirizine 10']};
const base=parse;
parse=function(t){const p=base(t),hit=norm(String(t)).split(' ').find(x=>AL[x]);
if(hit&&(!p||p.score<.75)){const ids=AL[hit].map(n=>STOCK.findIndex(s=>s.name===n)).filter(i=>i>=0);return{i:ids[0],name:'“'+hit+'” (which one?)',qty:p?p.qty:1,score:.5,ids,alt:''}}return p};
const isN=w=>/^\d+$/.test(w)||!!NUM[w];
function splitItems(text){const t=norm(String(text).replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d))).split(' ').filter(Boolean),segs=[];let cur=[];
const flush=()=>{if(cur.some(x=>!FORMS[x]&&!isN(x)&&!UNITS.has(x)))segs.push(cur.join(' '));cur=[]};
for(let i=0;i<t.length;i++){const w=t[i],nx=t[i+1];
if(SEP.has(w)){flush();continue}
if(UNITS.has(w)){cur.push(w);flush();continue}
cur.push(w);
if(isN(w)&&cur.length>1&&!/^\d{3,}$/.test(w)){const p=parse(cur.slice(0,-1).join(' '));
const str=p&&p.ids&&p.ids.some(k=>norm(STOCK[k].name).split(' ').includes(w));
if(!str&&!(nx&&(isN(nx)||UNITS.has(nx))))flush()}}
flush();return segs}
function listenMulti(lang){return new Promise((res,rej)=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return rej(new Error('Use Chrome'));let acc='',stop=false,r,ts=0;
const go=()=>{r=new SR();r.lang=lang;r.continuous=true;r.interimResults=true;
r.onresult=e=>{let im='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)acc+=' '+x[0].transcript;else im+=' '+x[0].transcript}$('heard').textContent=(acc+im).trim()};
r.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted'){stop=true;rej(new Error(e.error))}};
r.onend=()=>{if(stop)res({text:acc.trim(),ms:Math.round(performance.now()-ts)});else go()};r.start()};
stopper=()=>{stop=true;ts=performance.now();r.stop()};go()})}
function runItems(name,text,ms,b){$('heard').textContent=text||'(empty)';const segs=splitItems(text);
if(!segs.length)LOG.unshift({id:++uid,b,m:name,text,ms,p:null,ok:false});
segs.forEach(s=>{const p=parse(s),ok=!!p&&p.score>=.6;if(ok)STOCK[p.i].qty+=p.qty;LOG.unshift({id:++uid,b,m:name,text:s,ms,p,ok})});render()}
async function toggle(){if(stopper){stopper();return}if(busy)return;busy=true;const m=METHODS[cur];setBtn(true);
try{const b=++uid;
if(m.kind==='text')runItems(m.name,$('typed').value,0,b);
else if(m.kind==='ws'){const r=await listen(m.lang),x=best(r.alts);runItems(m.name,x?x.t:r.alts[0],r.ms,b)}
else{const r=await listenMulti(m.lang);if(!r.text)throw new Error('No speech heard');runItems(m.name,r.text,r.ms,b)}}
catch(e){$('heard').textContent='⚠ '+e.message}
stopper=null;busy=false;setBtn(false)}
function addItem(id,i){const L=LOG.find(x=>x.id===id);STOCK[i].qty+=L.p.qty;L.ok=true;L.p={...L.p,i,name:STOCK[i].name+' ('+STOCK[i].form+')',score:1};render()}
function render(){const L=LOG[0],items=L?LOG.filter(x=>x.b===L.b).reverse():[];
$('res').innerHTML=items.map(l=>l.p?`<div style="margin-top:6px"><b>${esc(l.p.name)}</b> × ${l.p.qty} ${l.ok?'✅ <button style="width:auto;padding:2px 8px;margin:0 4px;font-size:12px;background:var(--bad);color:#fff" onclick="removeItem('+l.id+')">remove</button>':'⚠ tap the right one'} <small>“${esc(l.text)}”</small>`+(l.ok?'':'<div>'+l.p.ids.map(i=>`<button style="width:auto;padding:8px 12px;margin:4px 4px 0 0;font-size:14px" onclick="addItem(${l.id},${i})">${esc(STOCK[i].name+' '+STOCK[i].form)}</button>`).join('')+'</div>')+'</div>':'<div>⚠ nothing understood</div>').join('');
$('log').innerHTML=LOG.map(l=>`<tr><td>${esc(l.m)}</td><td>${esc(l.text||'')}</td><td>${l.p?esc(l.p.name)+(l.ok?'':' ⚠'):'—'}</td><td>${l.p?l.p.qty:''}</td><td>${l.ms}</td></tr>`).join('');
$('stock').innerHTML=STOCK.filter(x=>x.qty).map(x=>`<tr><td>${esc(x.name)} <small>${x.form}</small></td><td>${x.qty}</td></tr>`).join('')||'<tr><td><small>Nothing added yet</small></td></tr>'}
METHODS.splice(1,0,{id:'gemini',name:'Gemini · say many items',kind:'gem'});
const mi=document.createElement('input');mi.id='model';mi.value='gemini-flash-latest';mi.placeholder='Gemini model name';mi.style.display='none';$('key').after(mi);
function pick(i){if(busy)return;cur=i;const m=METHODS[i];$('key').style.display=(m.kind==='rec'||m.kind==='gem')?'':'none';$('key').value=keys[m.id]||'';$('key').placeholder=m.name+' API key (stays in this page)';$('typed').style.display=m.kind==='text'?'':'none';$('model').style.display=m.kind==='gem'?'':'none';setBtn(false);
$('meth').innerHTML=METHODS.map((x,j)=>`<div class="m ${j===i?'on':''}" onclick="pick(${j})">${x.name}</div>`).join('')}
async function toWav(blob){const ctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000}),buf=await ctx.decodeAudioData(await blob.arrayBuffer()),d=buf.getChannelData(0),n=d.length,ab=new ArrayBuffer(44+n*2),v=new DataView(ab);
const S=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
S(0,'RIFF');v.setUint32(4,36+n*2,true);S(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);S(36,'data');v.setUint32(40,n*2,true);
for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}ctx.close();return new Blob([ab],{type:'audio/wav'})}
async function askGemini(b64,key,model){const list=STOCK.map((x,i)=>`${i}: ${x.name} ${x.form}`).join('\n');
const prompt=`You help a pharmacy in India add stock. The audio is a person saying several items in Hindi, English or mixed (for example "dolo 650 do patti", "bukhar ki goli teen"). Hindi numbers: ek=1 do=2 teen=3 char=4 paanch=5 chhe=6 saat=7 aath=8 nau=9 das=10. Match every item to this list by name, strength and form (tab, syrup, injection). Return ONLY JSON: {"items":[{"heard":"what was said","id":number or null,"qty":number,"options":[up to 3 ids]}]}. Use id null when not sure and put the likely ids in options. qty defaults to 1. Never invent items.\nLIST:\n${list}`;
const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'x-goog-api-key':key,'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'audio/wav',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});
const j=await r.json();if(!r.ok)throw new Error(j.error?j.error.message:JSON.stringify(j));
const t=j.candidates[0].content.parts.map(p=>p.text||'').join('');return JSON.parse(t.replace(/```json|```/g,'').trim()).items||[]}
const tg=toggle;
toggle=async function(){const m=METHODS[cur];if(m.kind!=='gem')return tg();
if(stopper){stopper();return}if(busy)return;busy=true;setBtn(true);
try{const key=(keys[m.id]||'').trim();if(!key)throw new Error('Enter your Gemini API key first');
const s=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(s),ch=[];mr.ondataavailable=e=>ch.push(e.data);
const done=new Promise(r=>mr.onstop=r);stopper=()=>mr.stop();mr.start();$('heard').textContent='Listening… tap Stop when done';await done;
s.getTracks().forEach(t=>t.stop());stopper=null;const t0=performance.now();$('heard').textContent='Thinking…';
const wav=await toWav(new Blob(ch,{type:mr.mimeType})),b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(wav)});
const items=await askGemini(b64,key,$('model').value.trim()||'gemini-flash-latest'),ms=Math.round(performance.now()-t0),b=++uid;
if(!items.length)throw new Error('Nothing understood');
$('heard').textContent=items.map(x=>x.heard).join(', ');
items.forEach(x=>{const id=Number.isInteger(x.id)&&STOCK[x.id]?x.id:null,q=Math.max(1,+x.qty||1),ids=(x.options||[]).filter(k=>STOCK[k]);
if(id!==null){STOCK[id].qty+=q;LOG.unshift({id:++uid,b,m:m.name,text:x.heard,ms,ok:true,p:{i:id,name:STOCK[id].name+' ('+STOCK[id].form+')',qty:q,score:1,ids}})}
else LOG.unshift({id:++uid,b,m:m.name,text:x.heard,ms,ok:false,p:{i:ids[0],name:'“'+x.heard+'” (which one?)',qty:q,score:.5,ids}})});render()}
catch(e){$('heard').textContent='⚠ '+e.message}
stopper=null;busy=false;setBtn(false)};
function removeItem(id){const L=LOG.find(x=>x.id===id);STOCK[L.p.i].qty-=L.p.qty;L.ok=false;L.p.ids=[...new Set([L.p.i,...(L.p.ids||[])])];render()}
pick(0);render();
</script></body></html>
